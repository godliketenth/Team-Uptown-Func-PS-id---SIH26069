name: CI

# Runs on every push and pull request. Both jobs are deliberately
# infrastructure-free: no Postgres service, no Kafka, no MinIO, no model
# download. Everything they check is a pure decision, and a suite that needs a
# database spun up is a suite people stop running.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # The console is TypeScript end to end; a type error here is a runtime
        # error in front of an operator.
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build
